<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Glasses YouTube HUD</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* 強制讓整個頁面不可被選取 */
            user-select: none;
            -webkit-user-select: none;
            /* 移除可能產生的外框 */
            outline: none !important;
        }
        
        /* 核心防護罩：禁止任何硬體事件直接點擊到播放器本身 */
        #player-wrapper {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
        }
        
        #player {
            width: 100%;
            height: 100%;
            /* 關鍵：讓播放器內部完全不吃任何點擊與焦點，藍框永遠點不出來 */
            pointer-events: none; 
        }

        /* 移除焦點時的藍框 */
        *:focus {
            outline: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body tabindex="0" id="main-body">

    <div id="player-wrapper">
        <div id="player"></div>
    </div>

    <script>
        // 1. 初始化 Firebase
        const firebaseConfig = {
            databaseURL: "https://ytonmetadisplay-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. 載入 YouTube IFrame Player API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: 'dQw4w9WgXcQ', 
                host: 'https://www.youtube-nocookie.com', // 阻擋廣告
                playerVars: {
                    'playsinline': 1,
                    'controls': 0, // 徹底關閉 YouTube 原生控制條，防止它搶走點擊
                    'autoplay': 1,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        // 3. 當播放器準備就緒
        function onPlayerReady(event) {
            // 強制將網頁焦點鎖死在 body 上，不給 YouTube 任何機會
            document.getElementById('main-body').focus();
            
            // 每秒鐘檢查一次，確保焦點沒被偷走
            setInterval(function() {
                document.getElementById('main-body').focus();
            }, 1000);

            // 監聽來自手機遙控端的 Firebase 訊號
            database.ref('currentVideo').on('value', function(snapshot) {
                var data = snapshot.val();
                if (data && data.id) {
                    var currentId = player.getVideoData()['video_id'];
                    if (currentId !== data.id) {
                        player.loadVideoById(data.id);
                    }
                    if (data.status === 'play') {
                        player.playVideo();
                    } else if (data.status === 'pause') {
                        player.pauseVideo();
                    }
                }
            });

            // 4. 精準硬體事件監聽 (搭配 true 捕獲模式)
            window.addEventListener('keydown', function(e) {
                if (!player || typeof player.getPlayerState !== 'function') return;
                
                var currentTime = player.getCurrentTime();

                switch (e.key) {
                    // 敲擊鏡腿 (Enter) -> 切換暫停或播放
                    case 'Enter':
                        e.preventDefault();
                        var state = player.getPlayerState();
                        if (state === YT.PlayerState.PLAYING) {
                            player.pauseVideo();
                            database.ref('currentVideo/status').set('pause');
                        } else {
                            player.playVideo();
                            database.ref('currentVideo/status').set('play');
                        }
                        break;

                    // 鏡腿水平/垂直滑動
                    case 'ArrowRight':
                    case 'ArrowUp':
                        e.preventDefault();
                        player.seekTo(currentTime + 10, true); // 快轉 10 秒
                        console.log("快轉 10 秒");
                        break;
                        
                    case 'ArrowLeft':
                    case 'ArrowDown':
                        e.preventDefault();
                        player.seekTo(currentTime - 10, true); // 倒轉 10 秒
                        console.log("倒轉 10 秒");
                        break;
                }
            }, true);
        }
    </script>
</body>
</html>
