<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Glasses YouTube HUD</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        /* 讓畫面完全變黑（在眼鏡中看起來就是透明），不遮擋現實視線 */
        body {
            margin: 0;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* YouTube 播放器容器 */
        #player {
            width: 100vw;
            height: 56.25vw; /* 保持 16:9 比例比例 */
            max-height: 100vh;
            max-width: 177.78vh;
        }
    </style>
</head>
<body>

    <div id="player"></div>

    <script>
        // 1. 初始化你的 Firebase (維持你原來的設定)
        const firebaseConfig = {
            databaseURL: "https://ytonmetadisplay-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. 載入 YouTube IFrame Player API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            // 預設先載入一個測試影片，並使用 youtube-nocookie.com 阻擋廣告
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: 'dQw4w9WgXcQ', 
                host: 'https://www.youtube-nocookie.com', // 強制啟動無廣告隱私模式
                playerVars: {
                    'playsinline': 1,
                    'controls': 1, // 顯示進度條，方便看狀態
                    'autoplay': 1,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        // 3. 當播放器準備就緒，開始監聽 Firebase 與 眼鏡觸控
        function onPlayerReady(event) {
            // 監聽 Firebase 訊號
            database.ref('currentVideo').on('value', function(snapshot) {
                var data = snapshot.val();
                if (data && data.id) {
                    var currentId = player.getVideoData()['video_id'];
                    // 如果 ID 不同，代表換歌了
                    if (currentId !== data.id) {
                        player.loadVideoById(data.id);
                    }
                    
                    // 控制播放或暫停
                    if (data.status === 'play') {
                        player.playVideo();
                    } else if (data.status === 'pause') {
                        player.pauseVideo();
                    }
                }
            });


// 4. 進階版：利用網頁座標，將眼鏡鏡腿劃分為「前、中、後」三個控制區
window.addEventListener('click', function(e) {
    // 阻止網頁點擊的預設行為（避免干擾 YouTube 播放器本身）
    e.preventDefault();
    
    // 取得目前眼鏡螢幕的總寬度，以及使用者點擊的 X 軸絕對座標
    var screenWidth = window.innerWidth;
    var clickX = e.clientX;
    
    // 確保 YouTube 播放器已經載入完畢
    if (player && typeof player.getPlayerState === 'function') {
        var currentTime = player.getCurrentTime();
        
        // 【邏輯拆解】：將眼鏡視野寬度切成三等份
        // 1. 點擊靠近鏡片的前端 (0% ~ 35% 區域) -> 倒轉 10 秒
        if (clickX < screenWidth * 0.35) {
            player.seekTo(currentTime - 10, true);
            console.log("偵測到點擊鏡腿前端：倒轉 10 秒");
        } 
        // 2. 點擊靠近耳朵的後端 (65% ~ 100% 區域) -> 快轉 10 秒
        else if (clickX > screenWidth * 0.65) {
            player.seekTo(currentTime + 10, true);
            console.log("偵測到點擊鏡腿後端：快轉 10 秒");
        } 
        // 3. 點擊正中間 (35% ~ 65% 區域) -> 暫停 / 播放
        else {
            var state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
                database.ref('currentVideo/status').set('pause');
                console.log("偵測到點擊鏡腿中段：暫停");
            } else {
                player.playVideo();
                database.ref('currentVideo/status').set('play');
                console.log("偵測到點擊鏡腿中段：播放");
            }
        }
    }
});


        }
    </script>
</body>
</html>
