<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meta Glass YT HUD</title>
    <style>
        body {
            margin: 0;
            background-color: #000000; /* 純黑在眼鏡內等於透明 */
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        .video-box {
            width: 100vw;
            height: 56.25vw; /* 16:9 比例完美置中 */
            background: #000;
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="video-box">
        <div id="player"></div>
    </div>

    <script>
        // 1. 初始化 Firebase (請替換成你自己的 Firebase 專案設定)
		const firebaseConfig = {
			databaseURL: "https://ytonmetadisplay-default-rtdb.firebaseio.com/"
		};
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let player;

        // 2. 初始化 YouTube 播放器（隱藏所有官方控制列）
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: 'dQw4w9WgXcQ', // 預設初始影片
                playerVars: {
                    'controls': 0,      // ❌ 隱藏控制列
                    'rel': 0,           // ❌ 播放完不推薦其他影片
                    'playsinline': 1,   // 🟢 網頁內播放
                    'autoplay': 1       // 🟢 自動播放
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            // 3. 監聽 Firebase 資料庫變化
            db.ref('currentVideo').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    // 當資料庫裡的影片 ID 改變時，眼鏡立刻切換影片
                    if (data.id) {
                        player.loadVideoById(data.id);
                    }
                    // 當收到暫停或播放指令時
                    if (data.command === 'pause') player.pauseVideo();
                    if (data.command === 'play') player.playVideo();
                }
            });

            // 4. 連動 Meta 眼鏡硬體觸控板 (點擊眼鏡畫面的空白處切換暫停)
            document.addEventListener('metaWearableReady', () => {
                window.metaWearable.on('tap', () => {
                    const state = player.getPlayerState();
                    if (state === YT.PlayerState.PLAYING) {
                        player.pauseVideo();
                        db.ref('currentVideo').update({ command: 'pause' });
                    } else {
                        player.playVideo();
                        db.ref('currentVideo').update({ command: 'play' });
                    }
                });
            });
        }
    </script>
</body>
</html>
