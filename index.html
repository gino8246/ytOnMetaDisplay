<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Glasses YouTube HUD</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        /* 讓畫面完全變黑（在眼鏡中看起來就是透明），不遮擋現實視線 */
        body {
            margin: 0;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* YouTube 播放器容器 */
        #player {
            width: 100vw;
            height: 56.25vw; /* 保持 16:9 比例比例 */
            max-height: 100vh;
            max-width: 177.78vh;
        }
    </style>
</head>
<body>

    <div id="player"></div>

    <script>
        // 1. 初始化你的 Firebase (維持你原來的設定)
        const firebaseConfig = {
            databaseURL: "https://ytonmetadisplay-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. 載入 YouTube IFrame Player API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            // 預設先載入一個測試影片，並使用 youtube-nocookie.com 阻擋廣告
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: 'dQw4w9WgXcQ', 
                host: 'https://www.youtube-nocookie.com', // 強制啟動無廣告隱私模式
                playerVars: {
                    'playsinline': 1,
                    'controls': 1, // 顯示進度條，方便看狀態
                    'autoplay': 1,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        // 3. 當播放器準備就緒，開始監聽 Firebase 與 眼鏡觸控
        function onPlayerReady(event) {
            // 監聽 Firebase 訊號
            database.ref('currentVideo').on('value', function(snapshot) {
                var data = snapshot.val();
                if (data && data.id) {
                    var currentId = player.getVideoData()['video_id'];
                    // 如果 ID 不同，代表換歌了
                    if (currentId !== data.id) {
                        player.loadVideoById(data.id);
                    }
                    
                    // 控制播放或暫停
                    if (data.status === 'play') {
                        player.playVideo();
                    } else if (data.status === 'pause') {
                        player.pauseVideo();
                    }
                }
            });

            // 4. 新增功能：監聽眼鏡鏡腿觸控（鍵盤事件）
            window.addEventListener('keydown', function(e) {
                // 智慧眼鏡敲擊通常會觸發 Space(空白鍵) 或 MediaPlayPause(多媒體鍵)
                if (e.code === 'Space' || e.key === 'MediaPlayPause') {
                    e.preventDefault();
                    var state = player.getPlayerState();
                    if (state === YT.PlayerState.PLAYING) {
                        player.pauseVideo();
                        // 同步更新回 Firebase，讓手機端同步更新狀態
                        database.ref('currentVideo/status').set('pause');
                    } else {
                        player.playVideo();
                        database.ref('currentVideo/status').set('play');
                    }
                }
                
                // 額外驚喜：如果眼鏡支援滑動鏡腿切換（通常對應左右方向鍵），可以快轉或倒退 10 秒
                if (e.key === 'ArrowRight') {
                    player.seekTo(player.getCurrentTime() + 10, true);
                }
                if (e.key === 'ArrowLeft') {
                    player.seekTo(player.getCurrentTime() - 10, true);
                }
            });
        }
    </script>
</body>
</html>
